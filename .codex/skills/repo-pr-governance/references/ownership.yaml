skill: repo-pr-governance
group: Repo Governance
owned_rules:
  - docs/rules/pr-workflow.md
  - docs/rules/review-guidelines.md
  - docs/rules/governance.md
  - docs/rules/collaboration.md
owned_commands:
  - make pre-pr
  - make verify-fast
  - make verify-full
  - make pr-ready
  - make pr-diagnose
  - make pr-resolve-threads
  - make pr-ready-for-review
  - make pr-merge
  - make pr-cleanup
  - make pr-complete
  - make ai-review
  - make risk-check
  - .\.venv\Scripts\python.exe -m scripts.research.governance
  - .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow ready
  - .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow diagnose
  - .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow resolve-threads
  - .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow ready-for-review
  - .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow merge
  - .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow cleanup
  - .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow complete
owned_scripts:
  - scripts/research/governance/pr_flow.py
  - scripts/research/governance/pr_review_evidence.py
  - scripts/research/governance/codex_review_monitor.py
uses:
  - repo-python-env
adapters:
  - .claude/skills/repo-pr-governance/SKILL.md
trigger_phrases:
  - 进入主干的 PR
  - review 证据
  - required checks
  - Codex review
  - 主干保护
read_rules:
  - docs/rules/pr-workflow.md
  - docs/rules/review-guidelines.md
  - docs/rules/governance.md
recommended_commands:
  - make verify-full
  - make pr-ready TITLE="<PR标题>"
  - make pr-diagnose PR=<PR号>
  - make pr-resolve-threads THREADS="<thread-id> [<thread-id>...]"
  - make pr-complete TITLE="<PR标题>"
  - make pr-cleanup PR=<PR号>
  - make ai-review
  - make risk-check
status: active
