<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ETF portfolio volatility figures</title>
  <style>
    body {
      margin: 24px;
      color: #172033;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f6f8fb;
    }
    h1 {
      margin: 0 0 20px;
      font-size: 22px;
    }
    section {
      margin-bottom: 28px;
      padding: 18px;
      border: 1px solid #dbe2ea;
      background: #fff;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 17px;
    }
    img {
      display: block;
      width: 100%;
      max-width: 1120px;
      height: auto;
      border: 1px solid #e5eaf0;
      background: #fff;
    }
  </style>
</head>
<body>
  <h1>ETF portfolio volatility figures</h1>
  <section>
    <h2>TargetVol vs average position</h2>
    <img src="target-vol-average-position-scan.svg" alt="TargetVol vs average position">
  </section>
  <section>
    <h2>Current volatility scale curve</h2>
    <img src="current-volatility-position-curve.svg" alt="Current volatility scale curve">
  </section>
</body>
</html>
