version: 2
encoding: utf-8

json:
  indent: 2
  ensure_ascii: false

github:
  required_settings:
    allow_auto_merge: true
    delete_branch_on_merge: true

required_checks:
  - PR Flow / review-status
  - Research Governance / verify-full
  - PR Flow / evidence

artifacts:
  reviewer_fragments:
    standards: .local/ai-review/fragments/standards.json
    spec: .local/ai-review/fragments/spec.json
    security: .local/ai-review/fragments/security.json
  review_fragments_handoff: .local/pr-flow/review-fragments-handoff.json
  resolve_threads_plan: .local/pr-flow/resolve-threads-plan.json
  thread_closure_evidence: .local/pr-flow/thread-closure-evidence.json
  local_stabilization: .local/pr-flow/local-stabilization.json
  submit_status: .local/pr-flow/status.json

rules:
  target_spec_wins: true
  fragment_freshness:
    same_diff_head_refresh: true
    description: "same-diff current-head review refresh updates fragment head without invalidating existing findings"
  local_review_fragment_builder:
    agent_only: true
    structured_payload_only: true
    public_command: false
    description: "agent-only builder maps structured reviewer verdict payloads into current-head local review fragments"
  local_stable_gate:
    before_official_codex_review: true
    required_checks:
      - Research Governance / verify-full
      - PR Flow / evidence
    excluded_checks:
      - PR Flow / review-status
    pending_reason_code: WAITING_LOCAL_STABILIZATION
    pending_phase: submit_local_stabilization
    description: "official Codex review is requested only after local evidence and non-review-status required checks are stable"
  github_native_closing_links:
    from_per_commit_evidence: true
    description: "closing links must derive from validated per-commit issue evidence, not from stale aggregate issue refs"
  codex_thread_automation:
    p0_p1_requires_closure_evidence: true
    human_never_auto_resolve: true
    no_severity_never_auto_resolve: true
    p2_p3_auto_accept: true
    description: "official Codex thread processing as a decision layer based on thread state, severity, and closure evidence"
  workflow_pending:
    before_execution: true
    description: "workflow jobs must publish pending status for owned required status contexts at job start, before time-consuming validation"

pr_evidence:
  marker_start: "<!-- pr-flow:start -->"
  marker_end: "<!-- pr-flow:end -->"
  fenced_language: json
  fields:
    - schema
    - head
    - diff
    - reviews
    - official_review
    - issues
    - retained
  official_review:
    required:
      fields:
        - decision
      decision: required
    skip_risk_low:
      fields:
        - decision
      decision: skip_risk_low
    skip_user_authorized:
      fields:
        - decision
        - authorized_by
        - evidence
      decision: skip_user_authorized

fragment:
  fields:
    - schema
    - head
    - diff
    - findings
  finding_fields:
    - severity
    - status
    - detail
    - evidence
    - rationale
    - reviewer
  finding_statuses:
    - open
    - fixed
    - false_positive
  security_review:
    fields:
      - tool
      - fallback_reason
    default_tool: codex-security
    fallback_reason_required_when_tool_not: codex-security
  delegation_attempt:
    fields:
      - required
      - authorization_basis
      - tool
      - result
      - reason
    authorization_basis: "AGENTS.md + ADR 0009"
    tool: spawn_agent
    results:
      - spawned
      - tool_unavailable
      - spawn_failed
    reason_required_results:
      - tool_unavailable
      - spawn_failed
    invalid_reason_tokens:
      - user_not_authorized
      - permission_not_allowed
      - explicit_authorization_missing
      - policy_disallowed
    tool_unavailable_invalid_reason_tokens:
      - empty_completion
      - timeout
      - timed_out
      - cancelled
      - canceled
      - tool_error
      - malformed_response

submit_status:
  fields:
    - schema_version
    - snapshot_subject
    - pr_submit_stop
    - checkpoint_statuses
    - blocking_signals
    - diagnostic_signals
    - suggested_next_actions
    - evidence_artifacts
  schema_version: 3
  description: "PR Flow 接手快照 v3；只服务当前 head 的失败接手，不作为成功证明。"
  snapshot_subject:
    fields:
      - repository
      - pr_number
      - head_sha
      - head_branch
    description: "快照描述的仓库、PR、head commit 和 head branch。head_sha 不匹配当前 PR head 时必须刷新。"
  pr_submit_stop:
    fields:
      - state
      - reason_code
      - phase
      - is_retryable
      - summary
    states:
      - DISPATCH_REQUIRED
      - REPLY_OR_FIX_REQUIRED
      - EXCEPTION_REQUIRED
    description: "pr-submit 停止状态；只解释停止位置，不判断根因或修复方案。"
  checkpoint_statuses:
    required_names:
      - official_codex_review
      - required_checks
      - pr_evidence
      - review_threads
      - local_review_fragments
    statuses:
      - unknown
      - pending
      - returned
      - passed
      - failed
      - stale
      - skipped
    fields:
      - checkpoint_name
      - status
      - summary
      - evidence_location
    description: "固定返回节点状态，所有 required_names 必须出现。"
  signal_fields:
    - signal_type
    - summary
    - source_context
    - evidence_location
    - currentness
    - is_retryable
  signal_currentness:
    - current
    - stale
    - unknown
  suggested_next_action_fields:
    - action_summary
    - recommended_command
    - applies_to_signal_types
  evidence_artifact_fields:
    - artifact_type
    - artifact_path
    - artifact_summary
  evidence_artifacts:
    review_fragments_handoff: ".local/pr-flow/review-fragments-handoff.json"
    resolve_threads_plan: ".local/pr-flow/resolve-threads-plan.json"
    local_stabilization: ".local/pr-flow/local-stabilization.json"
  closure_evidence:
    path: ".local/pr-flow/thread-closure-evidence.json"
    agent_only_builder: true
    structured_payload_only: true
    required_fields:
      - source
      - thread_id
      - severity
      - head_sha
      - diff_files_hash
      - disposition
      - evidence
    dispositions:
      fixed:
        required_fields:
          - fix_commit
          - verification_command
      false_positive:
        required_fields:
          - reason

severity:
  blocking:
    - P0
    - P1
  retained:
    - P2
    - P3

sources:
  retained:
    - standards
    - spec
    - security
    - official_codex

detail:
  max_chars: 200
  single_line: true

official_codex_request:
  command: "@codex review"
  fields:
    - pr
    - head
    - scope
