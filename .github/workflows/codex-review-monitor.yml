name: Codex Review Monitor

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to inspect"
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  monitor:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login != 'github-actions[bot]' &&
        (
          github.event.action == 'deleted' ||
          github.event.action == 'edited' ||
          contains(github.event.comment.body, '@codex review') ||
          contains(github.event.comment.body, 'Codex Review:')
        )
      )
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update Codex review monitor comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number }}
          PR_HEAD_UPDATED_AT: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && github.event.pull_request.updated_at || '' }}
        run: >-
          python -m scripts.research.governance.codex_review_monitor
          --head-updated-at-env PR_HEAD_UPDATED_AT
          --sync-comment
          --sync-status
