name: PR Flow Review Status

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to inspect"
        required: true
      expected_head_sha:
        description: "PR head SHA expected by the dispatching router"
        required: false
      trigger_event:
        description: "Event that requested this worker run"
        required: false
      trigger_run_id:
        description: "Router workflow run id that requested this worker run"
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}-${{ inputs.expected_head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  monitor:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment'
    runs-on: windows-latest
    steps:
      - name: Resolve PR head SHA
        id: pr-head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        shell: pwsh
        run: |
          $sha = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER" --jq '.head.sha'
          echo "sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ inputs.expected_head_sha || steps.pr-head.outputs.sha || github.event.pull_request.head.sha }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:PR_HEAD_SHA" `
            -f state="pending" `
            -f context="PR Flow / review-status" `
            -f description="Codex review status is running" `
            -f target_url="$env:TARGET_URL"
      - name: Guard expected PR head
        id: head-lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ steps.pr-head.outputs.sha }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          if ($env:EXPECTED_HEAD_SHA -and $env:PR_HEAD_SHA -ne $env:EXPECTED_HEAD_SHA) {
            gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:EXPECTED_HEAD_SHA" `
              -f state="error" `
              -f context="PR Flow / review-status" `
              -f description="PR head changed before monitor completed" `
              -f target_url="$env:TARGET_URL"
            echo "stale=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "stale=false" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@v4
        if: ${{ steps.head-lock.outputs.stale != 'true' }}
        with:
          ref: ${{ steps.pr-head.outputs.sha }}
      - uses: actions/setup-python@v5
        if: ${{ steps.head-lock.outputs.stale != 'true' }}
        with:
          python-version: "3.12"
      - name: Install dependencies
        if: ${{ steps.head-lock.outputs.stale != 'true' }}
        run: python -m pip install -r requirements-dev.txt
      - name: Update Codex review status
        if: ${{ steps.head-lock.outputs.stale != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          PR_HEAD_UPDATED_AT: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && github.event.pull_request.updated_at || '' }}
        run: >-
          python -m scripts.research.governance.codex_review_monitor
          --head-updated-at-env PR_HEAD_UPDATED_AT
          --expected-head-sha-env EXPECTED_HEAD_SHA
          --sync-status
      - name: Publish monitor failure status
        if: ${{ always() && steps.head-lock.outputs.stale != 'true' && (failure() || cancelled()) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ inputs.expected_head_sha || steps.pr-head.outputs.sha || github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $target = $env:PR_HEAD_SHA
          if (-not $target) {
            $target = gh api "repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER" --jq '.head.sha'
          }
          $state = if ($env:JOB_STATUS -eq 'cancelled') { 'error' } else { 'failure' }
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$target" `
            -f state="$state" `
            -f context="PR Flow / review-status" `
            -f description="Codex review status $state" `
            -f target_url="$env:TARGET_URL"
