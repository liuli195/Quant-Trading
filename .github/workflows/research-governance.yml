name: Research Governance

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify-full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure skill Junction
        shell: pwsh
        run: .\.githooks\ensure-skill-junction.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify full
        run: python -m scripts.research.governance verify full
