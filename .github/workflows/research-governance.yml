name: Research Governance

on:
  push:
  pull_request:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run governance gate
        run: python -m scripts.research.governance gate

  pr-review-evidence:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate PR review evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python -m scripts.research.governance.pr_review_evidence --body-env PR_BODY
