name: Research Governance

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-full:
    runs-on: windows-latest
    steps:
      - name: Publish pending status
        if: ${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment') && github.event.pull_request.state == 'open' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:PR_HEAD_SHA" `
            -f state="pending" `
            -f context="Research Governance / verify-full" `
            -f description="Full governance verification is running" `
            -f target_url="$env:TARGET_URL"
      - name: Enable symlink support
        run: git config --global core.symlinks true
      - uses: actions/checkout@v4
      - name: Record repository symlink support
        run: git config core.symlinks true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify full
        run: python -m scripts.research.governance verify full
      - name: Publish Research Governance status
        if: ${{ always() && github.event_name != 'push' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: pwsh
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } elseif ($env:JOB_STATUS -eq 'cancelled') { 'error' } else { 'failure' }
          gh api "repos/$env:GITHUB_REPOSITORY/statuses/$env:PR_HEAD_SHA" `
            -f state="$state" `
            -f context="Research Governance / verify-full" `
            -f description="Full governance verification $state" `
            -f target_url="$env:TARGET_URL"
