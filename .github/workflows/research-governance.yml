name: Research Governance

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  pull_request_review_thread:
    types: [resolved]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  governance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check scripts/research/governance
      - name: Bandit
        run: python -m bandit -q -r scripts/research/governance -x scripts/research/governance/tests -s B310,B404,B603,B607
      - name: Mypy
        run: python -m mypy --explicit-package-bases --follow-imports=skip --ignore-missing-imports scripts/research/governance
      - name: Pip audit
        run: python -m pip_audit
      - name: Tests
        run: python -m pytest scripts/research/governance/tests
      - name: Run governance gate
        run: python -m scripts.research.governance gate

  pr-review-evidence:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      github.event_name == 'pull_request_review_thread'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate PR review evidence
        env:
          PR_BODY: ${{ github.event.pull_request.body || github.event.issue.body }}
          PR_URL: ${{ github.event.pull_request.html_url || format('https://github.com/{0}/pull/{1}', github.repository, github.event.issue.number) }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_UPDATED_AT: ${{ github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened') && github.event.pull_request.updated_at || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m scripts.research.governance.pr_review_evidence
          --body-env PR_BODY
          --pr-url-env PR_URL
          --repo-env GITHUB_REPOSITORY
          --pr-number-env PR_NUMBER
          --head-sha-env PR_HEAD_SHA
          --head-updated-at-env PR_HEAD_UPDATED_AT
          --github-token-env GITHUB_TOKEN
