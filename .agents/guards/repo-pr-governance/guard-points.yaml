guard_points:
- id: local_review_gate
  description: 守卫 Standards / Spec review fragments 的当前状态产物存在性；fragment 内容语义由 pr_flow builder / pr-submit 校验。
  trigger:
    events:
    - state_completed
    states:
    - local_review_required
  inputs:
    artifacts:
    - standards_fragment
    - spec_fragment
  required_artifacts:
  - standards_fragment
  - spec_fragment
  checks:
  - id: standards_fragment_exists
    type: artifact_exists
    artifact: standards_fragment
    failure_reason: 缺少当前状态轮次的 standards fragment。
    fix_hint: 重新运行 Standards review，并通过 build-review-fragment 写入 current-state standards
      fragment。
  - id: spec_fragment_exists
    type: artifact_exists
    artifact: spec_fragment
    failure_reason: 缺少当前状态轮次的 spec fragment。
    fix_hint: 重新运行 Spec review，并通过 build-review-fragment 写入 current-state spec fragment。
  failure_reason: local review 当前状态产物不存在。
  fix_hint: 补齐 Standards / Spec current-state fragments；open P0/P1、delegation_attempt 和 head/diff 语义由 pr_flow fragment builder / pr-submit 阻断。JSON artifact 内容校验能力跟踪在 liuli195/my-agent-skills#15。
  override_policy:
    allowed: false
- id: security_review_gate
  description: 守卫 security review fragment 的当前状态产物存在性；fragment 内容语义由 pr_flow builder / pr-submit 校验。
  trigger:
    events:
    - state_completed
    states:
    - security_review_required
  inputs:
    artifacts:
    - security_fragment
  required_artifacts:
  - security_fragment
  checks:
  - id: security_fragment_exists
    type: artifact_exists
    artifact: security_fragment
    failure_reason: 缺少当前状态轮次的 security fragment。
    fix_hint: 运行 security review，并通过 build-review-fragment 写入 current-state security
      fragment。
  failure_reason: security review 当前状态产物不存在。
  fix_hint: 补齐 current-state security fragment；open P0/P1、security_review.tool / fallback_reason 和 head/diff 语义由 pr_flow fragment builder / pr-submit 阻断。JSON artifact 内容校验能力跟踪在 liuli195/my-agent-skills#15。
  override_policy:
    allowed: false
