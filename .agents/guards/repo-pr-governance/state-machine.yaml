    - effect: allow
      match:
        command_prefix: rg
      reason: 允许只读调查。
    - effect: allow
      match:
        command_prefix: Get-Content
      reason: 允许读取文件。
    - effect: allow
      match:
        command_prefix: Get-ChildItem
      reason: 允许列出文件。
    - effect: allow
      match:
        command_prefix: Test-Path
      reason: 允许检查路径存在性。
    - effect: allow
      match:
        command_prefix: git status
      reason: 允许查看 Git 状态。
    - effect: allow
      match:
        command_prefix: git diff
      reason: 允许查看 diff。
    - effect: allow
      match:
        command_prefix: git show
      reason: 允许查看提交内容。
    - effect: allow
      match:
        command_prefix: git log
      reason: 允许查看提交历史。
    - effect: allow
      tool: apply_patch
      reason: 允许修复当前 review finding；路径约束由主 agent 和 review finding 负责。
    - effect: allow
      tool: functions.apply_patch
      reason: 允许修复当前 review finding；路径约束由主 agent 和 review finding 负责。
    - effect: allow
      match:
        command_prefix: .\.venv\Scripts\python.exe -m pytest
      reason: 允许项目虚拟环境下的针对性测试。
    - effect: allow
      match:
        command_prefix: .\.venv\Scripts\python.exe -m scripts.research.governance
          verify fast
      reason: 允许日常 fast 验证。
    - effect: allow
      match:
        command_prefix: git add
      reason: 允许按仓库 commit intent 流程暂存修复。
    - effect: allow
      match:
        command_prefix: .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow
          intent stage
      reason: 允许为 staged diff 写 commit intent。
    - effect: deny
      match:
        command_prefix: git commit --amend
      reason: review finding 修复必须追加 commit，不得 amend。
      suggestion: 使用普通 git commit 追加提交。
    - effect: deny
      match:
        command_prefix: git commit --no-verify
      reason: 不得绕过 commit intent 和 pre-commit 审计。
      suggestion: 使用普通 git commit，并先运行 pr_flow intent stage。
    - effect: deny
      match:
        command_prefix: git commit -n
      reason: 不得绕过 commit intent 和 pre-commit 审计。
      suggestion: 使用普通 git commit，并先运行 pr_flow intent stage。
    - effect: deny
      match:
        command_prefix: git commit
        parameters:
          command:
            contains: --no-verify
      reason: 不得绕过 commit intent 和 pre-commit 审计。
      suggestion: 使用普通 git commit，并先运行 pr_flow intent stage。
    - effect: deny
      match:
        command_prefix: git commit
        parameters:
          cmd:
            contains: --no-verify
      reason: 不得绕过 commit intent 和 pre-commit 审计。
      suggestion: 使用普通 git commit，并先运行 pr_flow intent stage。
    - effect: allow
      match:
        command_prefix: git commit
      reason: 允许正常追加提交修复。
    - effect: allow
      match:
        command_prefix: .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow
          build-review-fragment --payload-file .local\guard\artifacts\repo-pr-governance\local-review\
      reason: 允许用 agent-only builder 写 Standards / Spec fragments。
    - effect: deny
      match:
        command_prefix: make pr-submit
      reason: local review 完成前不得运行 pr-submit。
      suggestion: 先完成 Standards / Spec fragments。
    - effect: deny
      match:
        command_prefix: .\.venv\Scripts\python.exe -m scripts.research.governance.pr_flow
          submit
      reason: local review 完成前不得运行 pr-submit。
      suggestion: 先完成 Standards / Spec fragments。
    - effect: deny
      match:
        command_prefix: git push
      reason: review 守卫完成前不得 push。
    - effect: deny
      match:
        command_prefix: git merge
      reason: review 守卫完成前不得 merge。
    - effect: deny
      match:
        command_prefix: git rebase
      reason: review finding 修复不得走 rebase。
    - effect: deny
      match:
        command_prefix: git reset
      reason: review finding 修复不得 reset。
  allowed_next:
  - 运行 Standards / Spec review。
  - 修复 Standards / Spec open P0/P1 finding。
  - 通过 agent-only builder 写 current-state Standards / Spec fragments。
  forbidden_next:
  - 运行 security review。
  - 运行 pr-submit 或 push。
  - merge/rebase/reset/amend。
  transition_conditions:
  - standards_fragment 和 spec_fragment 存在，且属于当前状态轮次。
