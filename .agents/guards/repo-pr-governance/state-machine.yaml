initial_state: local_review_required
terminal_states:
- completed
states:
- id: local_review_required
  description: 等待 Standards / Spec review 和 current-state fragments。
  permissions:
    default: deny
    rules:
    - effect: allow
      match:
        event_fields:
          action.name:
            equals: SubagentStart
          payload.parameters.name:
            in:
            - standards-reviewer
            - spec-reviewer
            - code-quality-reviewer
      reason: local_review_required 只允许 Standards / Spec reviewer。
    - effect: deny
      match:
        event_fields:
          action.name:
            equals: SubagentStart
          payload.parameters.name:
            in:
            - security-reviewer
            - security
      reason: Standards / Spec 通过前不得运行 security review。
      suggestion: 先完成 local review fragments，再进入 security_review_required。
    - effect: deny
      match:
        parameters:
          command:
            contains: ";"
      reason: 命令包含 shell 控制符，禁止用允许前缀串接受限动作。
      suggestion: 拆分为单一命令；review 守卫完成前不得串接命令。
    - effect: deny
      match:
        parameters:
          command:
            contains: "&&"
      reason: 命令包含 shell 控制符，禁止用允许前缀串接受限动作。
      suggestion: 拆分为单一命令；review 守卫完成前不得串接命令。
    - effect: deny
      match:
        parameters:
          command:
            contains: "||"
      reason: 命令包含 shell 控制符，禁止用允许前缀串接受限动作。
      suggestion: 拆分为单一命令；review 守卫完成前不得串接命令。
    - effect: deny
      match:
        parameters:
          command:
            contains: "|"
      reason: 命令包含 shell 控制符，禁止用允许前缀串接受限动作。
      suggestion: 拆分为单一命令；review 守卫完成前不得串接命令。
    - effect: deny
      match:
        parameters:
          command:
            contains: "\n"
      reason: 命令包含 shell 控制符，禁止用允许前缀串接受限动作。
      suggestion: 拆分为单一命令；review 守卫完成前不得串接命令。
    - effect: deny
      match:
        parameters:
          command:
            contains: "\r"
      reason: 命令包含 shell 控制符，禁止用允许前缀串接受限动作。
      suggestion: 拆分为单一命令；review 守卫完成前不得串接命令。
    - effect: deny
      match:
        parameters:
          cmd:
