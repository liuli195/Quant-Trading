  - 可以回到 repo-pr-governance 流程继续 pr-submit。
  forbidden_next: []
  transition_conditions: []
transitions:
- id: complete_local_review
  from: local_review_required
  to: security_review_required
  on_event: state_completed
  required_artifacts:
  - standards_fragment
  - spec_fragment
  guard_points:
  - local_review_gate
- id: complete_security_review
  from: security_review_required
  to: completed
  on_event: state_completed
  required_artifacts:
  - security_fragment
  guard_points:
  - security_review_gate
