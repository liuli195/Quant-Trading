nodes:
- id: run_local_review
  description: 运行 Standards / Spec review，不运行 security review。
  completion_signals:
  - local_review_fragments_ready
  required_artifacts:
  - standards_fragment
  - spec_fragment
- id: fix_local_review_findings
  description: 修复 Standards / Spec review 的当前 finding。
  completion_signals:
  - fix_committed
  required_artifacts: []
- id: build_local_review_fragments
  description: 通过 agent-only builder 写入 Standards / Spec fragments。
  completion_signals:
  - local_review_fragments_ready
  required_artifacts:
  - local_review_builder_payload
- id: run_security_review
  description: 运行 security review。
  completion_signals:
  - security_fragment_ready
  required_artifacts:
  - security_fragment
- id: fix_security_review_findings
  description: 修复 security review 的当前 finding。
  completion_signals:
  - fix_committed
  required_artifacts: []
- id: build_security_fragment
  description: 通过 agent-only builder 写入 security fragment。
  completion_signals:
  - security_fragment_ready
  required_artifacts:
  - security_builder_payload
states:
- id: local_review_required
  allowed_next:
  - run_local_review
  - fix_local_review_findings
  - build_local_review_fragments
  forbidden_next:
  - run_security_review
  - pr_submit
  - git_push
  missing_artifacts:
  - standards_fragment
  - spec_fragment
  brief:
    next_step: 完成 Standards / Spec review，修复 open P0/P1 后用 builder 写 current-state
      fragments。
- id: security_review_required
  allowed_next:
  - run_security_review
  - fix_security_review_findings
  - build_security_fragment
  forbidden_next:
  - run_local_review
  - pr_submit
  - git_push
  missing_artifacts:
  - security_fragment
  brief:
    next_step: 完成 security review，修复 open P0/P1 后用 builder 写 current-state security
      fragment。
- id: completed
  allowed_next: []
  forbidden_next: []
  missing_artifacts: []
  brief:
    next_step: local review 和 security review 守卫已完成。
